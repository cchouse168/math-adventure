<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三下 · 數學自學冒險</title>
<meta name="description" content="國小數學自學闖關遊戲：有注音、朗讀、動畫教學和怪獸對戰，依學期分關卡。">
<meta name="theme-color" content="#5f3dc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="數學冒險">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="../icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon/icon-512x512.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F7; --surface:#FFFFFF; --ink:#15222D; --muted:#5B6B78; --line:#D3DCE4;
  --a:#1C6FD1; --b:#E8590C; --c:#178A50; --d:#7B3FC4; --e:#C2255C;
  --ok:#178A50; --okbg:#E3F5EA; --bad:#C92A5A; --badbg:#FCE6EE; --pill:#F1F5F9; --tube:#DCE4EB; --gold:#F2A900;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171E; --surface:#17222C; --ink:#E6EDF3; --muted:#93A4B2; --line:#2A3946;
    --a:#5AA2F5; --b:#FF8A4C; --c:#4CC789; --d:#B18CF0; --e:#FF6B97;
    --ok:#4CC789; --okbg:#143223; --bad:#FF6B97; --badbg:#3A1724; --pill:#1F2D39; --tube:#24323E; --gold:#FFC93C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F171E; --surface:#17222C; --ink:#E6EDF3; --muted:#93A4B2; --line:#2A3946;
    --a:#5AA2F5; --b:#FF8A4C; --c:#4CC789; --d:#B18CF0; --e:#FF6B97;
    --ok:#4CC789; --okbg:#143223; --bad:#FF6B97; --badbg:#3A1724; --pill:#1F2D39; --tube:#24323E; --gold:#FFC93C;
    color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; font-size:19px; line-height:1.7; -webkit-tap-highlight-color:transparent; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
button{ font:inherit; color:inherit; }
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); }
.bar-in{ max-width:960px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:12px; min-height:60px; }
.bar h1{ font-size:20px; font-weight:900; margin:0; flex:1; }
.btn{ border:0; border-radius:14px; padding:10px 18px; min-height:48px; font-weight:700; cursor:pointer; background:var(--ink); color:var(--surface); }
.btn.alt{ background:var(--pill); color:var(--ink); }
.btn.accent{ background:var(--b); color:#fff; }
.btn:disabled{ opacity:.4; cursor:default; }
.btn:focus-visible,.card:focus-visible,.key:focus-visible{ outline:3px solid var(--a); outline-offset:2px; }
main{ max-width:960px; margin:0 auto; padding:18px 18px 90px; }
h2{ font-size:24px; margin:22px 0 10px; font-weight:900; line-height:2; }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
.card{ text-align:left; border:0; background:var(--surface); border-radius:20px; padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:6px; min-height:150px; border:2px solid var(--line); position:relative; }
.card .ic{ font-size:38px; line-height:1; }
.card .tt{ font-size:21px; font-weight:900; line-height:2; }
.card .no{ position:absolute; top:12px; right:14px; font-weight:900; color:var(--muted); font-size:15px; }
.stars{ color:var(--gold); font-size:20px; letter-spacing:2px; }
.stars .off{ color:var(--line); }
.card.prep{ border-color:color-mix(in srgb,var(--b) 40%,var(--line)); }
.card.g3{ border-color:color-mix(in srgb,var(--a) 40%,var(--line)); }
.parent{ margin-top:36px; background:var(--surface); border-radius:20px; padding:20px 22px; border:1px solid var(--line); font-size:16px; line-height:1.8; }
.parent h3{ margin:0 0 6px; font-size:19px; }
.parent ol{ padding-left:1.3em; margin:6px 0; }
.lesson-head{ display:flex; align-items:center; gap:12px; margin:8px 0 4px; }
.lesson-head .ic{ font-size:44px; }
.lesson-head .tt{ font-size:28px; font-weight:900; line-height:2.1; }
.goal{ color:var(--muted); margin:0 0 10px; line-height:2.2; }
.steps{ list-style:none; padding:0; margin:0 0 14px; counter-reset:s; }
.steps li{ counter-increment:s; display:flex; gap:10px; align-items:flex-start; line-height:2.2; margin:4px 0; }
.steps li::before{ content:counter(s); flex:none; width:30px; height:30px; margin-top:10px; border-radius:50%; background:var(--a); color:#fff; font-weight:900; display:grid; place-items:center; font-size:16px; }
.say{ flex:none; border:0; background:var(--pill); border-radius:12px; width:44px; height:42px; font-size:20px; cursor:pointer; margin-top:4px; }
.say.talking{ background:var(--a); }
.panel{ background:var(--surface); border-radius:22px; padding:18px; border:1px solid var(--line); margin:14px 0; }
.tip{ background:color-mix(in srgb,var(--gold) 18%,var(--surface)); border-radius:16px; padding:10px 16px; line-height:2.2; }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.msg{ min-height:2.4em; font-size:21px; line-height:2.2; margin:8px 0; }
.big{ font-size:46px; font-weight:900; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
.stepper{ display:inline-flex; align-items:center; gap:6px; background:var(--pill); border-radius:14px; padding:4px; }
.stepper button{ width:44px; height:44px; border:0; border-radius:10px; background:var(--surface); font-size:24px; font-weight:900; cursor:pointer; }
.stepper b{ min-width:2ch; text-align:center; font-size:24px; }
/* place value */
.pv{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px; }
.pvcol{ background:var(--pill); border-radius:16px; padding:8px; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:240px; }
.pvcol .nm{ font-weight:900; line-height:2.1; }
.pvcol .dg{ font-size:34px; font-weight:900; }
.blocks{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; align-content:flex-start; flex:1; }
.flash{ animation:fl .8s ease; }
@keyframes fl{ 0%{ transform:scale(1.06); background:color-mix(in srgb,var(--gold) 40%,var(--pill)); } 100%{ transform:scale(1); } }
/* column arithmetic */
.colcalc{ display:inline-grid; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:44px; font-weight:700; line-height:1.15; margin:8px 0; }
.colcalc .r{ display:flex; justify-content:flex-end; }
.colcalc .c{ width:1.15em; text-align:center; position:relative; border-radius:8px; }
.colcalc .carry{ font-size:22px; height:28px; color:var(--b); }
.colcalc .line{ border-top:4px solid currentColor; margin-top:4px; }
.colcalc .hl{ background:color-mix(in srgb,var(--gold) 35%,transparent); }
.colcalc .res{ color:var(--a); }
.colcalc s{ text-decoration-thickness:3px; color:var(--muted); }
.colcalc sup{ position:absolute; top:-.55em; left:50%; transform:translateX(-50%); font-size:22px; color:var(--b); }
/* array */
.arr{ display:flex; flex-direction:column; gap:8px; margin:10px 0; }
.arr .rw{ display:flex; gap:8px; align-items:center; padding:4px 8px; border-radius:12px; transition:background .2s; }
.arr .rw.on{ background:color-mix(in srgb,var(--gold) 30%,transparent); }
.arr .dot{ width:30px; height:30px; border-radius:50%; background:var(--a); }
.arr .cnt{ margin-left:10px; font-weight:900; font-size:22px; color:var(--b); min-width:2em; }
/* division */
.bag{ min-height:60px; font-size:30px; line-height:1.3; padding:8px; border:3px dashed var(--line); border-radius:16px; }
.plates{ display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; }
.plate{ width:130px; min-height:110px; border-radius:50%; background:var(--pill); border:3px solid var(--line); display:flex; flex-wrap:wrap; align-content:center; justify-content:center; font-size:24px; padding:16px; }
/* fraction */
.fr{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; font-weight:900; margin:0 .15em; font-variant-numeric:tabular-nums; }
.fr > span:first-child{ border-bottom:3px solid currentColor; padding:0 .2em; }
svg .piece{ cursor:pointer; fill:var(--surface); stroke:var(--ink); stroke-width:2.5; transition:fill .15s; }
svg .piece.on{ fill:var(--d); }
/* clock */
.clk .hand{ transition:transform .5s cubic-bezier(.3,.7,.4,1); transform-origin:100px 100px; }
/* practice */
.q{ font-size:24px; line-height:2.3; margin:6px 0 10px; }
.ansbox{ display:inline-flex; align-items:center; justify-content:center; min-width:150px; height:64px; border-radius:16px; border:3px solid var(--line); font-size:36px; font-weight:900; padding:0 14px; background:var(--surface); font-variant-numeric:tabular-nums; }
.ansbox.ok{ border-color:var(--ok); background:var(--okbg); } .ansbox.no{ border-color:var(--bad); background:var(--badbg); }
.keys{ display:grid; grid-template-columns:repeat(4,72px); gap:8px; margin-top:12px; }
.key{ height:62px; border:0; border-radius:14px; background:var(--pill); font-size:28px; font-weight:900; cursor:pointer; }
.key.go{ background:var(--c); color:#fff; font-size:20px; }
.choices{ display:flex; flex-wrap:wrap; gap:10px; }
.choice{ border:3px solid transparent; background:var(--pill); border-radius:16px; padding:10px 20px; min-height:64px; font-size:26px; cursor:pointer; }
.choice.ok{ border-color:var(--ok); background:var(--okbg); } .choice.no{ border-color:var(--bad); background:var(--badbg); }
.prog{ display:flex; gap:6px; margin-bottom:8px; }
.prog i{ width:28px; height:10px; border-radius:5px; background:var(--tube); }
.prog i.ok{ background:var(--ok); } .prog i.no{ background:var(--bad); } .prog i.cur{ background:var(--gold); }
.shake{ animation:sh .35s; } @keyframes sh{ 25%{ transform:translateX(-8px);} 75%{ transform:translateX(8px);} }
.result{ text-align:center; padding:20px; }
.result .stars{ font-size:56px; }
/* zhuyin */
.zy{ display:inline-flex; align-items:center; vertical-align:middle; margin:0 .05em; }
.zy.t{ margin-right:.3em; }
.zy .bp{ display:inline-flex; flex-direction:column; align-items:center; font-size:.45em; line-height:1.05; margin-left:.06em; font-weight:400; }
.zy .bp i{ font-style:normal; display:block; position:relative; }
.zy .bp i b{ position:absolute; left:100%; top:-.3em; font-weight:400; }
.zy .bp .nt{ line-height:.55; }
.bp .r{ display:inline-block; transform:rotate(90deg); }
#toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:12px 18px; border-radius:12px; font-size:16px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; }
#toast.show{ opacity:1; }
@media (max-width:640px){ .pv{ grid-template-columns:repeat(2,1fr); } .big{ font-size:36px; } .colcalc{ font-size:36px; } .keys{ grid-template-columns:repeat(4,1fr); } }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

.hud{ display:flex; gap:6px; align-items:center; }
.chip{ display:inline-flex; align-items:center; gap:4px; background:var(--pill); border-radius:999px; padding:4px 12px; font-size:17px; min-height:40px; border:0; }
.btnchip{ cursor:pointer; font-size:20px; }
.hero{ display:flex; align-items:center; gap:16px; background:linear-gradient(135deg,color-mix(in srgb,var(--a) 18%,var(--surface)),color-mix(in srgb,var(--b) 16%,var(--surface))); border-radius:24px; padding:16px 20px; margin-bottom:10px; flex-wrap:wrap; }
.avatar-big{ font-size:64px; animation:bob 2.4s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-6px); } }
.hero-t{ font-size:24px; font-weight:900; line-height:2.1; } .hero-s{ color:var(--muted); line-height:2.1; } .hero > div:nth-child(2){ flex:1; min-width:200px; }
.big-go{ font-size:22px; padding:12px 26px; min-height:58px; border-radius:18px; box-shadow:0 4px 0 color-mix(in srgb,var(--b) 60%,#000); }
.map{ position:relative; padding:10px 0 20px; }
.map svg.path{ position:absolute; left:0; top:0; pointer-events:none; z-index:0; }
.world > svg.path{ z-index:0; }
.world{ position:relative; margin:18px 0 6px; }
.world-h{ position:relative; z-index:1; display:inline-flex; align-items:center; gap:10px; background:var(--wc); color:#fff; font-weight:900; font-size:22px; border-radius:16px; padding:6px 18px; line-height:2.1; }
.world-h .wi{ font-size:30px; }
.world-h .zy .bp{ color:#fff; }
.nrow{ position:relative; z-index:1; display:flex; align-items:center; gap:14px; margin:18px 0; }
.nrow.l{ padding-left:4%; } .nrow.c{ padding-left:32%; } .nrow.r{ padding-left:58%; }
.node{ position:relative; flex:none; width:88px; height:88px; border-radius:50%; border:5px solid var(--wc,var(--a)); background:var(--surface); cursor:pointer; display:grid; place-items:center; box-shadow:0 6px 0 color-mix(in srgb,var(--wc,var(--a)) 45%,#000); transition:transform .15s; }
.node:active{ transform:translateY(4px); box-shadow:0 2px 0 color-mix(in srgb,var(--wc,var(--a)) 45%,#000); }
.node .nic{ font-size:42px; line-height:1; }
.node.boss{ width:108px; height:108px; border-width:6px; border-color:var(--e); box-shadow:0 6px 0 color-mix(in srgb,var(--e) 45%,#000); }
.node.boss .nic{ font-size:54px; }
.node.done{ background:color-mix(in srgb,var(--gold) 28%,var(--surface)); border-color:var(--gold); }
.node.lock,.node.time{ filter:grayscale(1); opacity:.55; }
.node.cur{ animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:0 6px 0 color-mix(in srgb,var(--wc,var(--a)) 45%,#000),0 0 0 0 color-mix(in srgb,var(--gold) 70%,transparent); } 50%{ box-shadow:0 6px 0 color-mix(in srgb,var(--wc,var(--a)) 45%,#000),0 0 0 16px transparent; } }
.node .me{ position:absolute; top:-34px; left:50%; transform:translateX(-50%); font-size:34px; animation:bob 1.6s ease-in-out infinite; }
.ncap{ display:flex; flex-direction:column; line-height:2; max-width:260px; }
.ncap b{ font-size:16px; color:var(--muted); } .ncap span{ font-weight:700; } .ncap small{ color:var(--muted); font-size:14px; } .ncap .flag{ color:var(--b); font-weight:900; }
.quest{ display:inline-flex; align-items:center; gap:10px; background:var(--ink); color:var(--surface); border-radius:14px; padding:6px 16px; font-weight:900; font-size:20px; line-height:2.1; margin:6px 0 10px; }
.quest .zy .bp{ color:var(--surface); }
.arena{ display:flex; align-items:center; justify-content:space-around; background:linear-gradient(180deg,color-mix(in srgb,var(--a) 14%,var(--surface)),color-mix(in srgb,var(--c) 16%,var(--surface))); border-radius:24px; padding:18px 10px 14px; margin:6px 0 8px; min-height:190px; }
.bossarena{ background:linear-gradient(180deg,color-mix(in srgb,var(--e) 20%,var(--surface)),color-mix(in srgb,var(--d) 22%,var(--surface))); }
.fighter{ font-size:84px; line-height:1; } .mon{ font-size:104px; } .bossarena .mon{ font-size:130px; }
.vs{ font-weight:900; font-size:28px; color:var(--muted); }
.foe{ display:flex; flex-direction:column; align-items:center; gap:8px; } .foe-n{ font-weight:900; line-height:2; }
.hp{ width:150px; height:16px; border-radius:8px; background:var(--tube); overflow:hidden; border:2px solid var(--ink); } .hp i{ display:block; height:100%; background:linear-gradient(90deg,var(--bad),var(--b)); transition:width .4s; }
.lunge{ animation:lunge .45s ease; } @keyframes lunge{ 40%{ transform:translateX(60px) rotate(10deg) scale(1.1); } }
.hit{ animation:hit .5s ease; } @keyframes hit{ 20%{ transform:translateX(12px) rotate(8deg); filter:brightness(1.8) saturate(.2); } 50%{ transform:translateX(-10px); } }
.taunt{ animation:taunt .6s ease; } @keyframes taunt{ 30%{ transform:translateY(-14px) scale(1.08); } 60%{ transform:translateY(0) rotate(-6deg); } }
.ko{ transition:transform .6s, opacity .6s; transform:rotate(90deg) scale(.6); opacity:.35; }
.combo-row{ justify-content:space-between; min-height:44px; }
.combo{ font-size:24px; font-weight:900; color:var(--b); animation:fl .5s ease; display:inline-block; }
.floaty{ position:absolute; transform:translateX(-50%); font-size:28px; font-weight:900; pointer-events:none; animation:up 1.1s ease forwards; z-index:30; }
@keyframes up{ to{ transform:translate(-50%,-70px); opacity:0; } }
.confetti{ position:fixed; inset:0; pointer-events:none; z-index:40; }
.sticker-get{ display:inline-flex; align-items:center; gap:10px; font-size:22px; font-weight:900; background:color-mix(in srgb,var(--gold) 25%,var(--surface)); padding:8px 18px; border-radius:16px; margin:8px 0; line-height:2.1; }
.sticker-get > .stk-e{ font-size:46px; animation:fl .8s ease; }
.stickers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px; }
.stk{ aspect-ratio:1; display:grid; place-items:center; font-size:42px; background:var(--surface); border-radius:18px; border:3px solid var(--gold); }
.stk.no{ border:3px dashed var(--line); color:var(--line); font-size:30px; }
.shop{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
.shopi{ display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--surface); border:3px solid var(--line); border-radius:18px; padding:10px; cursor:pointer; font-weight:700; line-height:2; }
.shopi.on{ border-color:var(--c); background:var(--okbg); } .shopi .sa{ font-size:50px; line-height:1.2; }
.parent summary{ cursor:pointer; font-size:17px; padding:4px 0; }
@media (max-width:640px){ .nrow.c{ padding-left:22%; } .nrow.r{ padding-left:40%; } .ncap{ max-width:170px; } .fighter{ font-size:64px; } .mon{ font-size:84px; } .bossarena .mon{ font-size:100px; } .bar h1{ font-size:16px; } .chip{ padding:2px 8px; font-size:15px; } }

/* ================= polish layer ================= */
:root{ --road:#f3e3c3; --road-edge:#d9c39a; --road-line:#fff; --shadow:0 10px 30px -12px rgba(20,40,70,.35); --world-t-sky:#3b2a6b; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --road:#3a4553; --road-edge:#2a323d; --road-line:#6b7a8c; --shadow:0 10px 30px -12px rgba(0,0,0,.7); } }
:root[data-theme="dark"]{ --road:#3a4553; --road-edge:#2a323d; --road-line:#6b7a8c; --shadow:0 10px 30px -12px rgba(0,0,0,.7); }
body{ background:radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb,var(--a) 16%,transparent), transparent 60%), radial-gradient(900px 500px at 110% 10%, color-mix(in srgb,var(--b) 14%,transparent), transparent 60%), var(--bg); background-attachment:fixed; }
.bar{ background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 2px 14px -8px rgba(0,0,0,.25); border-bottom:0; }
body::before{ background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.chip{ background:var(--surface); box-shadow:inset 0 0 0 2px var(--line), 0 2px 0 var(--line); font-family:"Fredoka",sans-serif; font-weight:700; }
/* candy buttons */
.btn{ --bc:#243447; background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 82%,#fff),var(--bc)); color:#fff; box-shadow:0 5px 0 color-mix(in srgb,var(--bc) 60%,#000), 0 8px 18px -8px color-mix(in srgb,var(--bc) 70%,transparent); transition:transform .08s, box-shadow .08s; }
.btn:active:not(:disabled){ transform:translateY(4px); box-shadow:0 1px 0 color-mix(in srgb,var(--bc) 60%,#000); }
.btn.accent{ --bc:#F76707; } .btn.alt{ --bc:var(--surface); color:var(--ink); background:var(--surface); box-shadow:inset 0 0 0 2px var(--line), 0 4px 0 var(--line); }
.btn .zy .bp{ opacity:.9; }
.panel{ border:0; box-shadow:var(--shadow); border-radius:26px; }
.tip{ border-radius:18px; box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent); }
/* hero */

function colCalc(el, opts){
  // opts: digits, op ('+','-' or 'both'), state
  let a, b, op = opts.op === "both" ? "+" : opts.op, step, carry, res, cur, orig, len, notes;
  const host = el;
  host.innerHTML = `<div class="row" id="ccOps"></div><div id="ccBoard"></div><div class="msg" id="ccMsg"></div><div class="row"><button class="btn" id="ccNext" type="button"></button><button class="btn alt" id="ccNew" type="button"></button></div>`;
  $("#ccNext", host).innerHTML = Z("下一步"); $("#ccNew", host).innerHTML = Z("換一題");
  if (opts.op === "both") {
    const ops = $("#ccOps", host);
    [["+","加法"],["-","減法"]].forEach(([o, nm]) => { const b2 = document.createElement("button"); b2.type = "button"; b2.className = "btn alt"; b2.innerHTML = Z(nm); b2.onclick = () => { op = o; fresh(); }; ops.appendChild(b2); });
  }
  function gen(){
    const lo = Math.pow(10, opts.digits - 1), hi = Math.pow(10, opts.digits) - 1;
    for (let t = 0; t < 200; t++) {
      let x = rnd(lo, hi), y = rnd(Math.max(10, Math.floor(lo / 2)), hi);
      if (op === "+") { if (x + y > 9999) continue; const s1 = String(x).padStart(5,"0"), s2 = String(y).padStart(5,"0"); let has = false; for (let i = 0; i < 5; i++) if (+s1[i] + +s2[i] >= 10) has = true; if (has) return [x, y]; }
      else { if (y >= x) [x, y] = [y, x]; if (x === y) continue; const s1 = String(x).padStart(5,"0"), s2 = String(y).padStart(5,"0"); let has = false; for (let i = 0; i < 5; i++) if (+s1[i] < +s2[i]) has = true; if (has) return [x, y]; }
    }
    return op === "+" ? [358, 476] : [605, 248];
  }
  function fresh(){
    [a, b] = gen(); len = Math.max(String(a).length, String(b).length) + (op === "+" ? 1 : 0);
    orig = String(a).padStart(len, " ").split(""); cur = orig.slice();
    carry = Array(len).fill(""); res = Array(len).fill(""); step = len - 1; notes = "";
    $("#ccMsg", host).innerHTML = Z("從個位開始，按「下一步」。"); $("#ccNext", host).disabled = false; draw(-1);
  }
  const PN = i => ["個位","十位","百位","千位","萬位"][len - 1 - i];
  function draw(hl){
    const B = String(b).padStart(len, " ").split("");
    const cell = (x, i, cls = "") => `<span class="c ${cls}${i === hl ? " hl" : ""}">${x === " " ? "&nbsp;" : x}</span>`;
    const top = cur.map((x, i) => x !== orig[i] && orig[i] !== " " ? `<span class="c${i === hl ? " hl" : ""}"><s>${orig[i]}</s><sup>${x}</sup></span>` : cell(x, i)).join("");
    $("#ccBoard", host).dataset.a = a; $("#ccBoard", host).dataset.b = b; $("#ccBoard", host).dataset.op = op;
    $("#ccBoard", host).innerHTML = `<div class="colcalc">
      <div class="r carry">${carry.map((x, i) => `<span class="c">${x}</span>`).join("")}<span class="c"></span></div>
      <div class="r">${top}<span class="c"></span></div>
      <div class="r">${B.map((x, i) => cell(x, i)).join("")}<span class="c" style="text-align:left">${op === "+" ? "＋" : "－"}</span></div>
      <div class="r line">${res.map((x, i) => cell(x, i, "res")).join("")}<span class="c"></span></div></div>`;
  }
  $("#ccNext", host).onclick = () => {
    if (step < 0) return;
    const B = String(b).padStart(len, "0").split("").map(Number);
    let msg = "";
    if (op === "+") {
      const A = String(a).padStart(len, "0").split("").map(Number);
      const c = carry[step] ? 1 : 0, s = A[step] + B[step] + c;
      if (step === 0 && A[0] === 0 && B[0] === 0) { if (c) { res[0] = "1"; msg = "最後進位的 1 寫在最左邊。"; } step = -1; }
      else {
        res[step] = String(s % 10);
        msg = `${PN(step)}：${A[step]} ＋ ${B[step]}${c ? " ＋ 進位的 1" : ""} ＝ ${s}`;
        if (s >= 10) { if (step > 0) carry[step - 1] = "1"; msg += `，滿 10 了！寫 ${s % 10}，進 1 到${PN(step - 1)}。`; } else msg += `，寫 ${s}。`;
        step--;
        if (step === 0 && !carry[0]) { const A0 = A[0], B0 = B[0]; if (A0 === 0 && B0 === 0) step = -1; }
      }
    } else {
      const C = cur.map(x => x === " " ? 0 : +x); let t = C[step]; const y = B[step];
      if (t < y) {
        let j = step - 1; while (j >= 0 && C[j] === 0) j--;
        const mid = j < step - 1;
        cur[j] = String(C[j] - 1); for (let k = j + 1; k < step; k++) cur[k] = "9";
        t += 10; cur[step] = String(t);
        msg = `${PN(step)}：${C[step]} 不夠減 ${y}，向${PN(j)}借 1，${mid ? "中間的 0 變成 9，" : ""}這一位變成 ${t}。`;
        draw(step); $("#ccMsg", host).innerHTML = Z(msg); return;
      }
      res[step] = String(t - y); msg = `${PN(step)}：${t} － ${y} ＝ ${t - y}。`;
      step--;
      if (step >= 0 && cur.slice(0, step + 1).every(x => x === " " || x === "0") && B.slice(0, step + 1).every(x => x === 0)) step = -1;
    }
    if (step < 0) { for (let i = 0; i < len - 1 && (res[i] === "0" || res[i] === ""); i++) res[i] = ""; const ans = op === "+" ? a + b : a - b; msg += ` 答案是 ${ans}。`; $("#ccNext", host).disabled = true; draw(-1); }
    else draw(step + 1);
    $("#ccMsg", host).innerHTML = Z(msg);
  };
  $("#ccNew", host).onclick = fresh;
  fresh();
}

function roadSvg(pts, w, h){
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], my = (y0 + y1) / 2; d += ` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`; }
  return `<svg class="path" width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--road-edge)" stroke-width="30" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--road)" stroke-width="22" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--road-line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/></svg>`;
}
function drawPath(){
  const m = $("#map"); if (!m) return; m.querySelectorAll("svg.path").forEach(x => x.remove());
  const center = (n, base) => { const r = n.getBoundingClientRect(); return [r.left - base.left + r.width / 2, r.top - base.top + r.height / 2]; };
  const r0 = m.getBoundingClientRect();
  const all = [...m.querySelectorAll(".node")].map(n => center(n, r0));
  m.insertAdjacentHTML("afterbegin", roadSvg(all, r0.width, m.scrollHeight));
  m.querySelectorAll(".world").forEach(wd => { const rw = wd.getBoundingClientRect(); const pts = [...wd.querySelectorAll(".node")].map(n => center(n, rw));
    const first = pts[0], before = [first[0], -40], last = pts[pts.length - 1], after = [last[0], rw.height + 40];
    wd.insertAdjacentHTML("afterbegin", roadSvg([before, ...pts, after], rw.width, rw.height)); });
}
addEventListener("resize", () => { clearTimeout(drawPath._t); drawPath._t = setTimeout(drawPath, 150); });
function openNode(i){
  const n = NODES[i], st = nodeState(i);
  if (st === "lock") { toast("先打敗前一關，才能挑戰這一關！"); SFX.bad(); return; }

  if (n.type === "boss") return battle(i);
  learn(i);
}

    ov.innerHTML = `<div class="modal ${win ? "win" : "lose"}"><div class="rays"></div><div class="trophy">${win ? "🏆" : n.monster + "💨"}</div>
      <div class="bigstars">${[0,1,2].map(k => `<span class="${k < s ? "on" : ""}" style="animation-delay:${.35 + k * .28}s">★</span>`).join("")}</div><div class="msg">${Z(win ? (boss ? "你打敗魔王了！" : "你打敗怪獸了！") : "怪獸逃走了⋯⋯再挑戰一次就能打敗牠！")}</div>
      <div class="msg">${Z(`一次就答對 ${firstOk} 題（共 ${total} 題）`)}</div>
      <div class="coinline">🪙 <b id="coinNum">0</b></div>
      ${first ? `<div class="sticker-get"><span class="stk-e">${n.sticker}</span><span>${Z("拿到新貼紙！")}</span></div>` : ""}
      ${unlocked.map(x => `<div class="secret-get"><span class="stk-e">${ART[x.id] ? art(x.id) : x.e}</span><span>${Z("解鎖秘密" + (x.kind === "avatar" ? "角色" : "配件") + "：" + x.name + "！")}</span></div>`).join("")}
      ${newBadges.map(b => `<div class="secret-get"><span class="stk-e">${b.e}</span><span>${Z("新徽章：" + b.name + "！")} 🪙 +${b.r}</span></div>`).join("")}
      ${s < 3 && win ? `<div class="msg" style="color:var(--muted)">${Z("拿到 3 顆星會更厲害喔！")}</div>` : ""}
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn accent" id="again" type="button">${Z("再挑戰一次")}</button><button class="btn" id="tohome" type="button">${Z("回地圖")}</button></div></div>`;
    countUp($("#coinNum"), earned + bonus);
    const close = () => ov.remove();
    $("#again").onclick = () => { close(); battle(i); }; $("#tohome").onclick = () => { close(); home(); };
    box.innerHTML = `<div class="msg" style="text-align:center">${Z("挑戰結束！")}</div>`;
    if (win) $("#mon").classList.add("ko");
  }
  nextQ();
}

/* ---------- bag ---------- */
let bagTab = "ava";
function bag(){
  $("#backBtn").style.display = ""; window.scrollTo(0, 0);
  checkSecrets(); const nb = checkBadges();
  if (nb.length) { toast(`拿到 ${nb.length} 個新徽章，送你 ${nb.reduce((a, b) => a + b.r, 0)} 金幣！`); SFX.win(); confetti(); hud(); }
  const got = new Set(gs.stickers);
  const tabs = [["ava","角色"],["acc","配件"],["secret","秘密"],["badge","成就"],["stk","貼紙簿"]];
  const lockTxt = t => Z(`到「${WORLDS[t].name}」開放`);
  let body = "";
  if (bagTab === "ava") {
    body = `<p class="goal">${Z("用金幣買新角色，買了就可以一直用。越後面越稀有！")}</p><div class="shop">${AVATARS.map(([a, c], i) => { const own = gs.owned.includes(a), t = AVA_TIER(i), open = own || worldReached(t);
      return `<button class="shopi ${gs.avatar === a ? "on" : ""}${open ? "" : " locked"}" type="button" data-a="${a}" data-c="${c}" data-t="${t}"><span class="sa">${open ? a : "❔"}</span><span>${own ? Z(gs.avatar === a ? "使用中" : "選這個") : open ? "🪙 " + c : "🔒 " + lockTxt(t)}</span></button>`; }).join("")}
      ${SECRETS.filter(x => x.kind === "avatar" && gs.secrets.includes(x.id)).map(x => `<button class="shopi secret ${gs.avatar === x.e ? "on" : ""}" type="button" data-a="${x.e}" data-c="0"><span class="sa">${glyph(x.e)}</span><span>${Z(gs.avatar === x.e ? "使用中" : x.name)}</span></button>`).join("")}</div>`;
  } else if (bagTab === "acc") {
    body = ACC_SLOTS.map(([slot, nm]) => {
      const items = ACCS.filter(a => a.slot === slot).map(a => ({ id: a.id, e: a.e, c: a.c, own: gs.ownedAcc.includes(a.id), t: ACC_TIER[a.id] || 0 }))
        .concat(SECRETS.filter(x => x.kind === slot && gs.secrets.includes(x.id)).map(x => ({ id: x.id, e: x.e, c: 0, own: true, secret: true })));
      return `<h3 class="slot-h">${Z(nm)}</h3><div class="shop">${items.map(a => { const on = gs.acc[slot] === a.id;
        const open = a.own || worldReached(a.t || 0);
        return `<button class="shopi acc ${on ? "on" : ""}${a.secret ? " secret" : ""}${open ? "" : " locked"}" type="button" data-id="${a.id}" data-slot="${slot}" data-c="${a.c}" data-t="${a.t || 0}"><span class="sa">${open ? (a.secret && ART[a.id] ? art(a.id) : a.e) : "❔"}</span><span>${a.own ? Z(on ? "戴上了" : "戴上") : open ? "🪙 " + a.c : "🔒 " + lockTxt(a.t)}</span></button>`; }).join("")}
        ${gs.acc[slot] ? `<button class="shopi acc off" type="button" data-id="" data-slot="${slot}" data-c="0"><span class="sa">🚫</span><span>${Z("拿下來")}</span></button>` : ""}</div>`; }).join("");
  } else if (bagTab === "secret") {
    body = `<p class="goal">${Z("完成特別任務，就能解鎖秘密角色和配件！")}</p><div class="secrets">${SECRETS.map(x => { const ok = gs.secrets.includes(x.id);
      return `<div class="sec ${ok ? "ok" : ""}"><span class="sa${ok ? "" : " sil"}">${ART[x.id] ? art(x.id) : (ok ? x.e : "❓")}${ok ? "" : '<i class="q">？</i>'}</span><b>${Z(ok ? x.name : "？？？")}</b><span class="hint">${Z((ok ? "✅ " : "🔒 ") + x.hint)}</span></div>`; }).join("")}</div>`;
  } else if (bagTab === "badge") {
    body = `<p class="goal">${Z("完成挑戰就能拿到徽章，還會送金幣喔！")}</p><div class="secrets">${BADGES.map(b => { const ok = gs.badges.includes(b.id);
      return `<div class="sec ${ok ? "ok" : ""}"><span class="sa">${ok ? b.e : "🔘"}</span><b>${Z(b.name)}</b><span class="hint">${Z((ok ? "✅ " : "🎯 ") + b.desc)} 🪙 ${b.r}</span></div>`; }).join("")}</div>`;
  } else {
    body = `<div class="stickers">${NODES.map(n => `<div class="stk ${got.has(n.key) ? "" : "no"}">${got.has(n.key) ? n.sticker : "？"}</div>`).join("")}</div>`;
  }
  main.innerHTML = `<div class="bag-top"><div class="bag-ava">${avatarHtml()}</div><div><h2 style="margin:0">${Z("我的背包")}</h2><div class="goal" style="margin:0">🪙 ${gs.coins}　🏅 ${gs.stickers.length} / ${NODES.length}　❓ ${gs.secrets.length} / ${SECRETS.length}　🎖️ ${gs.badges.length} / ${BADGES.length}</div></div></div>
    <div class="tabs">${tabs.map(([k, nm]) => `<button class="tab ${bagTab === k ? "on" : ""}" type="button" data-t="${k}">${Z(nm)}</button>`).join("")}</div>${body}`;
  main.querySelectorAll(".tab").forEach(b => b.onclick = () => { bagTab = b.dataset.t; bag(); });
  main.querySelectorAll(".shopi:not(.acc)").forEach(b => b.onclick = () => { const a = b.dataset.a, c = +b.dataset.c;
    if (b.classList.contains("locked")) { toast(`到「${WORLDS[+b.dataset.t].name}」就會上架，繼續闖關吧！`); SFX.bad(); return; }
    if (gs.owned.includes(a)) { gs.avatar = a; saveGs(); SFX.coin(); bag(); hud(); return; }
    if (gs.coins < c) { toast(`還差 ${c - gs.coins} 金幣，再去打幾隻怪獸吧！`); SFX.bad(); return; }
    gs.coins -= c; gs.owned.push(a); gs.avatar = a; saveGs(); SFX.win(); confetti(); hud(); bag(); });
  main.querySelectorAll(".shopi.acc").forEach(b => b.onclick = () => { const id = b.dataset.id, slot = b.dataset.slot, c = +b.dataset.c;
    if (b.classList.contains("locked")) { toast(`到「${WORLDS[+b.dataset.t].name}」就會上架，繼續闖關吧！`); SFX.bad(); return; }
    if (!id) { gs.acc[slot] = null; saveGs(); bag(); return; }
    const own = gs.ownedAcc.includes(id) || gs.secrets.includes(id);
    if (own) { gs.acc[slot] = gs.acc[slot] === id ? null : id; saveGs(); SFX.coin(); bag(); return; }
    if (gs.coins < c) { toast(`還差 ${c - gs.coins} 金幣，再去打幾隻怪獸吧！`); SFX.bad(); return; }
    gs.coins -= c; gs.ownedAcc.push(id); gs.acc[slot] = id; saveGs(); SFX.win(); confetti(); hud(); bag(); });
}

/* ---------- parent ---------- */
function parentPanel(){
  const w = weekNow(), P = TX.plan[w - 1], d = daysOfWeek(w);
  return `<details class="parent"><summary><b>給家長：進度設定與說明</b></summary>
    <p>目前是第 <b>${w}</b> 週（${esc(P.title)}），這週已練習 <b>${d}</b> 天，建議每週 4 天、每天 15～20 分鐘。</p>
    <div class="row" style="margin:8px 0"><button class="btn alt" id="wPrev" type="button">◀ 上一週</button><button class="btn alt" id="wNext" type="button">下一週 ▶</button>
      <label style="display:flex;align-items:center;gap:8px;font-size:16px"><input type="checkbox" id="noGate" ${gs.noGate ? "checked" : ""} style="width:22px;height:22px"> 不受週數限制（只要過前一關就能往下）</label></div>
    <ol>
      <li><b>闖關規則</b>：每一關先「學一學」玩互動區，再打怪獸（5 題）。一次答對 3 題以上算過關，才會開下一關。每個世界最後有魔王關（8 題，混合整個世界的題目）。</li>
      <li><b>時間節奏</b>：一般關卡會依週數開放，避免孩子一口氣衝太快。學得快可以按「下一週」或勾選不受週數限制；卡住了就按「上一週」，或讓他重打同一關。</li>
      <li><b>獎勵</b>：答對得金幣（一次答對 10、連擊再加 5），過關得貼紙，金幣可以換角色。連續每天練習會累積 🔥 天數。</li>
      <li><b>第 1～9 週</b>補二年級基礎（進位、退位、九九），第 10 週起才是三年級上學期內容。</li>
    </ol>
    <p>紀錄只存在這台裝置的瀏覽器。<button class="btn alt" id="resetAll" type="button" style="min-height:36px;padding:4px 12px">清除全部紀錄</button></p></details>`;
}
function bindParent(){
  $("#wPrev").onclick = () => shiftWeek(-1); $("#wNext").onclick = () => shiftWeek(1);
  $("#noGate").onchange = e => { gs.noGate = e.target.checked; saveGs(); home(); };
  $("#resetAll").onclick = () => { if (confirm("確定要清除全部的星星、金幣、貼紙和週數嗎？")) { gs = { levels: {}, coins: 0, stickers: [], owned: ["🐱","🐶"], avatar: "🐱", days: [], log: [] }; saveGs(); home(); } };
}
home();
</script>
<script>
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__bip = e; try { hud(); } catch(_){} try { showInstall(); } catch(_){} });
window.addEventListener("appinstalled", () => { window.__bip = null; try { hud(); toast("已安裝！之後可以從桌面或主畫面直接打開。"); } catch(_){} });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).then(reg => {
      reg.addEventListener("updatefound", () => { const nw = reg.installing; if (!nw) return;
        nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) { try { toast("有新版本了！重新開啟就會更新。"); } catch(_){} } }); });
    }).catch(err => console.log("SW 註冊失敗", err));
  });
}
